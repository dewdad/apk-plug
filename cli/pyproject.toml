[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apk-plug"
version = "0.1.0"
description = "CLI tool for APK static analysis, threat identification, and rebuild pipeline"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "APK Remediation Pipeline" }]
keywords = ["apk", "android", "security", "malware", "decompile", "rebuild"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "jsonschema>=4.21",
]

[project.optional-dependencies]
native = ["androguard>=3.4.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[project.scripts]
apk-plug = "apk_plug.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/apk_plug"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",        # pydocstyle - skip for now
    "ANN101",   # missing self type
    "ANN102",   # missing cls type
    "COM812",   # trailing comma (conflicts with formatter)
    "ISC001",   # single-line implicit string concat (conflicts with formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "ANN"]
